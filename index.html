<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>लोकसेवा GK & IQ Bank</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #22c55e;
      --danger: #f87171;
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header {
      text-align: center;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    header h1 { font-size: 1.45rem; font-weight: 700; color: var(--accent); }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .stats {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 12px 0;
      font-size: 0.8rem;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      color: var(--muted);
    }
    .stat strong { color: var(--accent); }
    .search-box { position: relative; margin-bottom: 12px; }
    .search-box input {
      width: 100%;
      padding: 14px 44px 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
    }
    
    /* Dataset & Sub-category selectors */
    .dataset-select-wrap { margin-bottom: 10px; }
    .dataset-select-wrap select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      outline: none;
    }
    .dataset-select-wrap select:focus { border-color: var(--accent); }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }
    .actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    button, .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-success { background: var(--accent2); color: #0f172a; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: var(--danger); color: #0f172a; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    
    /* Card Styles */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--accent); }
    .card .q { font-weight: 600; font-size: 0.98rem; margin-bottom: 8px; color: #e2e8f0; }
    .card .a {
      color: var(--accent2);
      font-size: 0.92rem;
      padding: 8px 10px;
      background: rgba(34, 197, 94, 0.08);
      border-radius: 8px;
      border-left: 3px solid var(--accent2);
    }
    .card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .tag {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
    }

    /* Distinct Visual Styles per Dataset File */
    .card.universe-card {
      border-left: 4px solid #38bdf8;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    }
    .card.geography-card {
      border-left: 4px solid #f97316;
      background: linear-gradient(135deg, #1e293b 0%, #1c1917 100%);
    }
    .card.user-card {
      border-left: 4px solid #22c55e;
    }
    .source-badge {
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      margin-left: 4px;
    }

    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    
    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card);
      width: 100%;
      max-width: 500px;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { font-size: 1.15rem; margin-bottom: 16px; color: var(--accent); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
    .modal-actions button { flex: 1; }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--accent2);
      color: #0f172a;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 200;
      transition: transform 0.3s;
      max-width: 90vw;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--danger); }
    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 6px;
    }
    footer { text-align: center; padding: 24px 0 12px; color: var(--muted); font-size: 0.75rem; }
    @media (min-width: 600px) {
      .modal { border-radius: 16px; margin-bottom: 40px; }
      .modal-overlay { align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 लोकसेवा GK & IQ Bank</h1>
      <p>Search • Store • Study — Offline Ready</p>
    </header>

    <div class="stats">
      <div class="stat">कुल: <strong id="totalCount">0</strong></div>
      <div class="stat">देखाइएको: <strong id="shownCount">0</strong></div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="खोज्नुहोस्... (प्रश्न, उत्तर वा श्रेणी)" autocomplete="off" />
      <button class="clear-btn" id="clearSearch" title="Clear">✕</button>
    </div>

    <!-- Dataset Selector -->
    <div class="dataset-select-wrap">
      <select id="datasetSelect" onchange="handleDatasetChange()">
        <!-- Options are generated from DATASETS in app.js -->
      </select>
    </div>

    <!-- Sub-category Chips -->
    <div class="filters" id="filters"></div>

    <div class="actions">
      <button class="btn-primary" onclick="openAddModal()">+ नयाँ थप्नुहोस्</button>
      <button class="btn-outline" onclick="exportData()">Export JSON</button>
      <button class="btn-outline" onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
    </div>

    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none">कुनै परिणाम फेला परेन।</div>

    <footer>
      Questions load directly from JSON files.<br>
      Questions you add here are saved in your browser.
    </footer>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modalTitle">नयाँ प्रश्न थप्नुहोस्</h2>
      <div class="form-group">
        <label>प्रश्न (Question)</label>
        <textarea id="qInput" placeholder="प्रश्न लेख्नुहोस्..."></textarea>
      </div>
      <div class="form-group">
        <label>उत्तर (Answer)</label>
        <textarea id="aInput" placeholder="उत्तर लेख्नुहोस्..."></textarea>
      </div>
      <div class="form-group">
        <label>श्रेणी (Category)</label>
        <select id="catInput"></select>
      </div>
      <div class="modal-actions">
        <button class="btn-outline" onclick="closeModal()">रद्द</button>
        <button class="btn-success" id="saveBtn" onclick="saveItem()">सेभ गर्नुहोस्</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
